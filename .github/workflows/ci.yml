name: CI

# The guardrail the retro asked for. Pre-commit hooks only fire on files the
# committer touched, so pre-existing offenders slipped through until the
# next ticket inherited them. This workflow runs every check against the
# full repo on every PR and every push to main.
#
# The token check (`check:tokens`) reads scripts/oversize-baseline.json so
# today's offenders do not fail CI. A new offender fails, and a baselined
# file that grows fails. The baseline is a ratchet, not a free pass.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: File token sizes
        run: node scripts/check-file-tokens.js --all

      - name: Format
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint:oxlint

      - name: Typecheck
        run: npm run typecheck

      - name: Boundaries
        run: npm run lint:boundaries

      - name: Tests
        run: npm run test
